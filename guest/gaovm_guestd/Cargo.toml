[package]
name = "gaovm_guestd"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
jsonschema = { version = "0.58.6", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["signal", "process", "user", "fs", "feature"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
ulid = "3.0.0"
