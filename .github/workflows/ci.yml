name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract schemas
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Validate JSON Schema and OpenAPI
        run: bash scripts/validate_contracts.sh

  dart-static:
    name: Dart static checks (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: gaovm_models
            directory: libs/gaovm_models
            paths: lib test
            entrypoint: ''
          - package: gaovm_rpc
            directory: libs/gaovm_rpc
            paths: lib test
            entrypoint: ''
          - package: gaovm_api_client
            directory: libs/gaovm_api_client
            paths: lib test
            entrypoint: ''
          - package: gaovmd
            directory: daemon/gaovmd
            paths: bin lib test tool
            entrypoint: bin/gaovmd.dart
          - package: gaovm_cli
            directory: clients/gaovm_cli
            paths: bin lib test tool
            entrypoint: bin/gaovm_cli.dart
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.0

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles(format('{0}/pubspec.lock', matrix.directory)) }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Resolve dependencies
        run: dart pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed ${{ matrix.paths }}

      - name: Analyze
        run: dart analyze

      - name: Compile executable
        if: matrix.entrypoint != ''
        run: dart compile exe ${{ matrix.entrypoint }} -o "${RUNNER_TEMP}/${{ matrix.package }}"

      - name: Compile cold maintenance operator
        if: matrix.package == 'gaovmd'
        run: dart compile exe tool/maintain_macos.dart -o "${RUNNER_TEMP}/gaovm-maintenance"

  macos-package-components:
    name: macOS packaging component checks
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.0

      - name: Build ARM64 service helper for assembly checks
        working-directory: services/macos_service
        run: swift build -c release --triple arm64-apple-macosx14.0

      - name: Resolve daemon dependencies
        working-directory: daemon/gaovmd
        run: dart pub get --enforce-lockfile

      - name: Check bundle assembly and daemon launch paths
        working-directory: daemon/gaovmd
        run: >-
          dart test test/macos_app_package_test.dart
          test/vm_bundle_filesystem_test.dart
          test/daemon_launch_configuration_test.dart
          test/packaged_daemon_launch_test.dart --concurrency=1

      - name: Check daemon API startup and legacy recovery
        working-directory: daemon/gaovmd
        run: >-
          dart test test/daemon_application_test.dart
          test/legacy_vm_migration_test.dart --concurrency=1

      - name: Check cold operator and recovery with native observation fixtures
        working-directory: daemon/gaovmd
        run: >-
          dart test test/macos_release_inspection_test.dart
          test/cold_publication_tool_test.dart
          test/candidate_validation_launch_test.dart
          test/macos_driver_inventory_test.dart --concurrency=1

      - name: Check validation request and catalog write isolation
        working-directory: daemon/gaovmd
        run: >-
          dart test test/public_api_server_test.dart
          test/sqlite_database_test.dart
          test/sqlite_read_only_validation_test.dart
          test/artifact_api_handlers_test.dart
          test/system_doctor_test.dart
          test/candidate_validation_entrypoint_test.dart --concurrency=1

      - name: Check cold state and snapshot boundaries
        working-directory: daemon/gaovmd
        run: >-
          dart test test/cold_catalog_inspection_test.dart
          test/cold_file_references_test.dart
          test/cold_legacy_inspection_test.dart
          test/cold_managed_assets_test.dart
          test/cold_runtime_inspection_test.dart
          test/cold_state_snapshot_test.dart
          test/cold_state_lease_test.dart
          test/cold_state_restoration_test.dart
          test/cold_state_backup_test.dart
          test/daemon_ownership_move_test.dart
          test/maintenance_tree_test.dart
          test/maintenance_snapshot_test.dart
          test/maintenance_state_fence_test.dart --concurrency=1

      - name: Resolve CLI dependencies
        working-directory: clients/gaovm_cli
        run: dart pub get --enforce-lockfile

      - name: Check CLI launch paths and public API overrides
        working-directory: clients/gaovm_cli
        run: >-
          dart test test/default_socket_path_test.dart
          test/packaged_cli_launch_test.dart
          test/public_api_cli_test.dart --concurrency=1

  rust-guest-static:
    name: Rust guest and host publication checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guest/gaovm_guestd
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy --target aarch64-unknown-linux-gnu

      - name: Cache Cargo packages and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            guest/gaovm_guestd/target
          key: cargo-${{ runner.os }}-1.96.1-${{ hashFiles('guest/gaovm_guestd/Cargo.lock') }}

      - name: Check formatting
        run: cargo +1.96.1 fmt --all --check

      - name: Clippy
        run: cargo +1.96.1 clippy --all-targets --locked -- -D warnings

      - name: Build guest protocol library
        run: cargo +1.96.1 build --all-targets --locked

      - name: Check Linux ARM64 guest target
        run: cargo +1.96.1 check --locked --target aarch64-unknown-linux-gnu

      - name: Set up Dart for host publication integration
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.0

      - name: Resolve host dependencies
        working-directory: daemon/gaovmd
        run: dart pub get --enforce-lockfile

      - name: Test real Rust guest to Dart host publication
        working-directory: daemon/gaovmd
        env:
          GAOVM_GUEST_FIXTURE: ${{ github.workspace }}/guest/gaovm_guestd/target/debug/examples/host_publication_fixture
        run: dart test test/host_guest_artifacts_test.dart --name 'real Rust guest' --concurrency=1

  swift-style:
    name: Swift format and lint (${{ matrix.package }})
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: vz_macos
            directory: drivers/vz_macos
          - package: gaovm_service
            directory: services/macos_service
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify pinned formatter
        run: |
          swift --version
          test "$(swift format --version)" = "6.2.3"

      - name: Check formatting and lint
        run: swift format lint --strict --recursive Package.swift Sources Tests

  macos-service:
    name: macOS service helper
    runs-on: macos-14
    defaults:
      run:
        working-directory: services/macos_service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build native helper
        run: swift build

      - name: Check commands, signing, and registration boundary
        run: swift test

      - name: Build ARM64 release helper
        run: swift build -c release --triple arm64-apple-macosx14.0

  swift-build:
    name: Swift build
    runs-on: macos-14
    defaults:
      run:
        working-directory: drivers/vz_macos
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build driver
        run: swift build
